# XcodeGen 用のプロジェクト定義。
#   brew install xcodegen && cd ios && xcodegen generate && open AppGuard.xcodeproj
# で AppGuard.xcodeproj を生成できる。
name: AppGuard
options:
  bundleIdPrefix: com.example.appguard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # ↓ 自分の Apple Developer Team ID に置き換える
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AppGuard:
    type: application
    platform: iOS
    sources:
      - AppGuard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appguard
        INFOPLIST_FILE: AppGuard/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppGuard/AppGuard.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ShieldConfig
      - target: ShieldAction
      - target: DeviceActivityMonitor

  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfig
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appguard.ShieldConfig
        INFOPLIST_FILE: ShieldConfig/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfig/ShieldConfig.entitlements
        GENERATE_INFOPLIST_FILE: NO

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldAction
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appguard.ShieldAction
        INFOPLIST_FILE: ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: NO

  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityMonitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appguard.Monitor
        INFOPLIST_FILE: DeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
        GENERATE_INFOPLIST_FILE: NO
